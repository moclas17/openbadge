upstream api {
    server api:3001;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 15m;

    # ── Proxy common headers ─────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_connect_timeout  60s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    # ── API routes ───────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://api/;

        # Strip the /api prefix before forwarding
        rewrite ^/api/(.*)$ /$1 break;
    }

    # Auth endpoints get a tighter rate limit
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://api/auth/;

        rewrite ^/api/auth/(.*)$ /auth/$1 break;
    }

    # ── Health check (bypass rate limiting) ─────────────
    location /health {
        access_log off;
        proxy_pass http://api/health;
    }

    # ── Frontend / Next.js ───────────────────────────────
    location / {
        proxy_pass http://frontend/;

        # Support Next.js WebSocket hot-reload in dev (harmless in prod)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static assets — cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
